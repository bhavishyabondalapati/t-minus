name: E2E (manual)
# Runs the Playwright suite against a deployed URL. Manual because it signs in as the demo user.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test
        required: true
        default: https://t-minus-drab.vercel.app

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: ${{ inputs.url }}
